<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
    <style>
        input {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .success {
            color: green;
            font-weight: bold;
            margin: 10px 0;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>
    <h2>Update Event Details</h2>

       {% if message %}
        <div class="success" id="successMessage">{{ message }}</div>
        <script>
            // Auto-hide after 5 seconds
            setTimeout(function() {
                var msg = document.getElementById("successMessage");
                if (msg) {
                    msg.style.opacity = "0"; // fade out
                    setTimeout(() => msg.remove(), 500); // remove from DOM after fade
                }
            }, 5000);
        </script>
    {% endif %}

    <form method="POST"  action="{{ url_for('set_event') }}">
        <label for="event_name">Current Event Name:</label><br>
        <input type="text" name="event_name" value="{{ event_name }}" required><br><br>

        <label for="event_date">Event Date:</label><br>
        <input type="date" name="event_date" value="{{ event_date }}" required><br><br>

        <label for="event_time">Event Time:</label><br>
        <input type="text" name="event_time" value="{{ time }}" required><br><br>

        <label for="venue">Venue:</label><br>
        <input type="text" name="venue" value="{{ venue }}" required><br><br>

        <button type="submit">Update Event</button> 
    </form>
    <br>
    <a href="/logout">Logout</a>
    </script>
</body>
</html>
