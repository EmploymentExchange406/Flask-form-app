<!DOCTYPE html>
<html>
<head>
    <title>Placement Drive Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @media (max-width: 768px) {
    .form-container {
        flex-direction: column !important;
        align-items: stretch;
        gap: 20px;
    }

    .left-section,
    .right-section {
        width: 100% !important;
    }

    .field {
        flex-direction: column;
    }

    .field label {
        margin-bottom: 5px;
    }
}

        body {
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .form-container {
            background-color: #d9d9d9;
            backdrop-filter: blur(10px);   
            -webkit-backdrop-filter: blur(10px); 
            padding: 25px;
            max-width: 850px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header img {
            max-width: 100%;
            height: auto;
            border-radius: 12px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }
        .form-title {
            font-weight: bold;
            font-size: 20px;
            margin-top: 10px;
        }
        form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px 20px;
        }
        label {
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 7px;
            border: 1px solid #999;
            border-radius: 5px;
             box-sizing: border-box;
        }
        .full-width {
            grid-column: 1 / span 2;
        }
        .btn-row {
            grid-column: 1 / span 2;
            text-align: center;
            margin-top: 10px;
        }
            .submit-btn {
                background-color: #4CAF50;
                padding: 10px 30px;
                color: white;
                border: none;
                border-radius: 10px;
        }
            
            .submit-btn:hover {
                background-color: #45a049;
        }
        
            .clear-btn {
                background-color: #f44336;
                padding: 10px 30px;
                color: white;
                border: none;
                border-radius: 10px;
        }
            
            .clear-btn:hover {
                background-color: #da190b;
        }
            
            .admin-btn {
                background-color: #008CBA;
                padding: 10px 30px;
                color: white;
                border: none;
                border-radius: 10px;
        }
            
            .admin-btn:hover {
                background-color: #005f73;
        }
            
                label::after {
             content: " :";
             color: black;
             font-weight: bold;
        }
       #successPopup {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: rgba(0,0,0,0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        }
        
        .popup-content {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="header">
          <div class="header">
  <img src="/static/Banner.png" alt="Goa Govt Logo">
</div>
            <div class="form-title">Placement Drive / Session Registration Form</div>
        </div>
        <form method="POST" action="/" autocomplete="off">
            <label>FULL NAME</label>
            <input type="text" name="fullname" required>

            <label>GENDER</label>
            <select name="gender" required>
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Transgender</option>
            </select>

            <label>ADDRESS</label>
            <input type="text" name="address" required>

            <label>CATEGORY</label>
            <select name="category" id="category" required oninvalid="this.setCustomValidity('Please select a category')" oninput="this.setCustomValidity('')">
                <option value="">Select</option>
                <option>General</option>
                <option>OBC</option>
                <option>SC</option>
                <option>ST</option>
            </select>

            <label>TALUKA</label>
            <select name="taluka" required>
                <option value="">Select</option>
                <option>Bardez</option>
                <option>Bicholim</option>
                <option>Canacona</option>
                <option>Dharbandora</option>
                <option>Mormugoa</option>
                <option>Pernem</option>
                <option>Ponda</option>
                <option>Quepem</option>
                <option>Salcete</option>
                <option>Sanguem</option>
                <option>Sattari</option>
                <option>Tiswadi</option>
            </select>

            <label>STATE</label>
            <select name="state" required>
                <option value="">Select</option>
                <option>Goa</option>
            </select>

            <label>MOBILE NO.</label>
            <input type="text" name="mobile" maxlength="10" 
            pattern="[0-9]{10}" maxlength="10" 
            autocomplete="off" 
            oninvalid="this.setCustomValidity('Enter valid mobile number')"oninput="this.setCustomValidity('')"required>

            <label>EXPERIENCE IN YEARS</label>
            <input type="number" name="experience" step="0.1" required>

            <label>EMAIL ID</label>
            <input type="email" name="email"  autocomplete="off" required>

            <label>EMPLOYMENT STATUS</label>
            <select name="employment" required>
                <option value="">Select</option>
                <option>Employed</option>
                <option>Unemployed</option>
            </select>

            <label>HIGHEST QUALIFICATION</label>
            <input type="text" name="qualification" required>

            <label>REGISTERED FOR EMPLOYMENT CARD</label>
             <select id="employmentCard" name="employmentCard" onchange="toggleCardNumberField()" required>
                <option value="">Select</option>
                <option>Yes</option>
                <option>No</option>
            </select>
              <label id="employmentCardLabel" style="display: none;">EMPLOYMENT CARD NUMBER</label>
              <input type="text" id="employmentCardNumber" pattern="LBR/LE/\d{4}/\d{3,}" placeholder="eg.LBR/LE/****/********" name="employmentCardNumber" style="display: none;">
              </div>
            <div class="btn-row">
                <button type="submit" class="submit-btn" style="width: 120px; height: 40px;">SUBMIT</button>
                <button type="reset" class="clear-btn" style="width: 120px; height: 40px;">CLEAR</button>
                <button type="button" class="admin-btn" style="width: 120px; height: 40px;" onclick="openAdminWindow()">ADMIN</button>

                  <!-- Script to handle window popup -->
                  <script>
                    function openAdminWindow() {
                      window.open(
                        "{{ url_for('admin') }}",
                        "AdminPanel",
                        "width=600,height=500,resizable=yes,scrollbars=yes"
                      );
                    }
                  </script>
            <div id="successPopup" style="display: none;">
                <div class="popup-content">
                    <img src="{{ url_for('static', filename='Done.gif') }}" alt="Success" width="150">
                    <p style="font-weight: bold; font-size: 24px;">Submission Successful !</p>
                </div>
             </div>
        </form>
<script>
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('success') === 'true') {
            document.getElementById('successPopup').style.display = 'flex';

            // Optional: Hide after 3 seconds
            setTimeout(() => {
                document.getElementById('successPopup').style.display = 'none';
            }, 3000);
        }
    }
</script>

   <script>
function toggleCardNumberField() {
    const select = document.getElementById("employmentCard");
    const label = document.getElementById("employmentCardLabel");
    const input = document.getElementById("employmentCardNumber");

    if (select.value === "Yes") {
        label.style.display = "block";
        input.style.display = "block";
    } else {
        label.style.display = "none";
        input.style.display = "none";
    }
}
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const form = document.querySelector("form");
        const submitButton = document.querySelector(".submit-btn");

        form.addEventListener("submit", function () {
            submitButton.disabled = true; // Prevent double-click
            submitButton.innerText = "Submitting..."; // Optional visual feedback
        });
    });
</script>
</body>
</html>
