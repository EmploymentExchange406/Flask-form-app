<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>
</head>
<body>
    <h2>Welcome, Admin</h2>
    <button onclick="window.location.href='/set_event'">Set Event Details</button>
    <button onclick="window.location.href='/generate-report'">Generate Report</button>
    <button onclick="window.open('https://docs.google.com/spreadsheets/d/1MIkP8Yy-qT6gwPlKvrUXAB7dJcQTd_thcxdXQB-_22s/edit?pli=1&gid=0#gid=0', '_blank')">Google Sheet</button>
    <br><br>
    <a href="/logout">Logout</a>

    <script>
    let inactivityTime = function () {
        let timer;

        function logout() {
            alert("You have been logged out due to inactivity.");
            window.location.href = "/logout";  // your logout route
        }

        function resetTimer() {
            clearTimeout(timer);
            timer = setTimeout(logout, 60000); // 1 minute = 60000 ms
        }

        // Listen for user activity
        window.onload = resetTimer;
        document.onmousemove = resetTimer;
        document.onkeypress = resetTimer;
        document.onscroll = resetTimer;
        document.onclick = resetTimer;
    };

    inactivityTime();

  // Log out when user closes the tab/window
        window.addEventListener('beforeunload', function (e) {
            // Make a fetch request to logout on close
            navigator.sendBeacon('/logout');  // Use sendBeacon to avoid blocking the unload
        });
</script>
</body>
</html>
